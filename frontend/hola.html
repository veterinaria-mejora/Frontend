<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
          <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script type="module" src="gaga.js"></script>
        <title>Carrito - Layout</title>
        <style>
            :root {
                --bg: #ffffff;
                --card-bg: #f7eaea;
                --muted: #6b7280;
                --accent: #00a650; /* verde envío */
                --primary: #0b76ff; /* botón continuar */
                --border: #e6e9ee;
                --shadow: 0 6px 18px rgba(11, 23, 40, 0.06);
                --container-width: 1200px;
                --radius: 12px;
            }

            /* Reset ligero */
            * {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
            }

            body {
                margin: 0;
                font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
                background: var(--bg);
                color: #111827;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                padding: 36px 16px;
                display: flex;
                justify-content: center;
            }

            /* Contenedor central */
            .cart-wrapper {
                width: 100%;
                max-width: var(--container-width);
                display: grid;
                grid-template-columns: 1fr 360px;
                gap: 24px;
            }

            /* Panel productos */
            .cart-items {
                display: flex;
                flex-direction: column;
                gap: 18px;
            }

            .store-section {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 18px;
                box-shadow: var(--shadow);
            }

            .store-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
            }

            .store-header input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }

            .store-title {
                font-weight: 600;
            }

            .products-list {
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            /* Tarjeta de producto */
            .product-card {
                display: grid;
                grid-template-columns: 96px 1fr auto;
                gap: 16px;
                align-items: center;
                padding: 14px;
                border-radius: 10px;
                background: linear-gradient(180deg, rgba(247,248,250,1) 0%, rgba(255,255,255,1) 100%);
                border: 1px solid #f0f2f5;
            }

            .product-img {
                width: 96px;
                height: 96px;
                object-fit: contain;
                border-radius: 8px;
                background: #fafafa;
                display: block;
            }

            .product-meta {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .product-name {
                font-size: 15px;
                font-weight: 600;
                color: #111827;
                margin: 0;
            }

            .product-sub {
                font-size: 13px;
                color: var(--muted);
            }

            .product-controls {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .qty-control {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                border: 1px solid var(--border);
                padding: 6px 8px;
                border-radius: 8px;
                background: #fff;
            }

            .qty-control button {
                border: none;
                background: transparent;
                cursor: pointer;
                font-size: 18px;
                width: 22px;
                height: 22px;
                display: inline-grid;
                place-items: center;
            }

            .product-price {
                text-align: right;
                min-width: 120px;
            }

            .price-current {
                display: block;
                font-weight: 700;
                font-size: 18px;
            }

            .price-old {
                display: block;
                font-size: 13px;
                color: var(--muted);
                text-decoration: line-through;
            }

            .shipping-bar-wrap {
                margin-top: 10px;
            }

            .shipping-bar {
                height: 8px;
                background: #e8f7ee;
                border-radius: 999px;
                overflow: hidden;
                border: 1px solid rgba(0,0,0,0.04);
            }

            .shipping-progress {
                height: 100%;
                width: 100%;
                transition: width 0.4s ease, background-color 0.4s ease;
                background-color: rgb(76, 175, 80)
            }

            .shipping-label {
                margin-top: 8px;
                font-size: 13px;
                color: var(--accent);
                font-weight: 600;
            }
            .gaga{
                margin-top: 8px;
                font-size: 13px;
                color: var(--accent);
                font-weight: 600;
            }
            /* Panel resumen */
            .cart-summary {
                position: sticky;
                top: 36px;
                height: fit-content;
                align-self: start;
            }

            .summary-card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 18px;
                box-shadow: var(--shadow);
            }

            .summary-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
                color: var(--muted);
            }

            .summary-total {
                font-size: 20px;
                font-weight: 700;
                margin-top: 6px;
            }

            .btn-primary {
                display: inline-block;
                width: 100%;
                padding: 12px 16px;
                border-radius: 10px;
                text-align: center;
                background: var(--primary);
                color: white;
                font-weight: 700;
                border: none;
                cursor: pointer;
                font-size: 16px;
                box-shadow: 0 6px 14px rgba(11,118,255,0.18);
            }

            .coupon-link {
                display: block;
                margin-top: 8px;
                font-size: 13px;
                color: var(--primary);
                text-decoration: none;
                font-weight: 600;
            }

            /* Pequeños ajustes responsivos */
            @media (max-width: 980px) {
                .cart-wrapper {
                    grid-template-columns: 1fr;
                }

                .cart-summary {
                    position: static;
                }
            }
            .product-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border-bottom: 1px solid #eee;
}

.product-img {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
}

.product-meta {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.product-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.qty-control {
    display: flex;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
}

.qty-control button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
}

.product-price {
    text-align: right;
    min-width: 180px;
}

.price-old {
    color: #999;
    text-decoration: line-through;
    font-size: 14px;
}

.price-current {
    font-size: 20px;
    font-weight: 600;
}

.discount-tag {
    color: #00a650;
    font-weight: 700;
}
.shipping-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    width: 100%;
    margin-bottom: 10px;
}
/* Overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 900;
}

/* Modal */
.modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    min-width: 420px;
    background: #fff;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    display: none;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 1000;
}

/* Mostrar modal */
.modal.show {
    display: block;
    opacity: 1;
    transform: translate(-50%, -50%);
}

.overlay.show {
    display: block;
    opacity: 1;
}

/* Botón cerrar */
.close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
}

/* Input + botón */
.modal-content {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.modal-content input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.apply-btn {
    padding: 10px 16px;
    background: #3483fa;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

        </style>
    </head>
    <body>

        <main class="cart-wrapper">
            <section class="cart-items">
                <article class="store-section">
                    <div class="store-header">
                        <div>
                            <div class="store-title">Productos</div>
                        </div>
                    </div>

                    <div class="products-list" id="products-list">

                    </div>
                    <div class="shipping-bar-wrap">
                        <div class="shipping-header">
                            <span style="margin-top: 10px;font-size: 20px;">Envio</span>
                            <span class="shipping-label"></span>
                            
                        </div>
                        <div class="shipping-bar" aria-hidden>
                            <div class="shipping-progress"></div>
                        </div>
                        <div class="shipping-labell"></div>
                    </div>
                </article>
            </section>

            <aside class="cart-summary">
                <div class="summary-card">
                    <div>resumen de compra</div><br>
                    <div class="summary-row">
                        <div>productos</div>
                        <div style="color: black" class="priceProducts"></div>
                    </div>

                    <div class="summary-row">
                        <div>Envío</div>
                        <div style="color: var(--accent);" class="EnvioState"></div>
                    </div>

                    <div class="summary-row summary-total">
                        <div>Total</div>
                        <div class="TotalPrice"></div>
                    </div>

                    <button class="btn-primary">Continuar compra</button>
                    <button class="coupon-lin" id="openModalBtn">Ingresar código de cupón</button>
                </div>
            </aside>
        
        </main>

        <div id="overlay" class="overlay"></div>

        <div id="modal" class="modal">
            <button class="close-btn" id="closeModalBtn">×</button>
            <h2>Cupones</h2>

            <div class="modal-content">
                <input type="text" placeholder="Ingresar código de cupón" id="input">
                <button class="apply-btn" id="apply-btn">Agregar cupón</button>
        </div>
</div>
    </body>
</html>
