    <div class="container">
        <h1>Agregar Producto</h1>

        <form id="form-producto">
            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="Ej: Mouse Gamer" required>

            <label>Precio</label>
            <input type="number" id="precio" placeholder="Ej: 15000" required>

            <label>Stock</label>
            <input type="number" id="stock" placeholder="Ej: 10" required>

            <label>URL Imagen</label>
            <input type="text" id="url_imagen" placeholder="https://ejemplo.com/img.jpg" required>

            <button type="submit">Guardar Producto</button>
        </form>
