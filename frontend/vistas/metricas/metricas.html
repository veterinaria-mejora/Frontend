<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VetCare Admin</title>

  <!-- Tus estilos -->
  <link rel="stylesheet" href="/frontend/styles/metricasstyles.css">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="admin">

  <header>
    <nav>
      <div class="logo"><i class="fa-solid fa-gear"></i> VetCare Admin</div>
      <ul>
        <li><a href="/frontend/vistas/admin.html">Admin</a></li>
        <li><a href="/frontend/vistas/formulario/listadelosformularios.html">Solicitudes</a></li>
        <li><a href="/frontend/vistas/verUsuarios/GestionarUser.html">Gestionar</a></li>
        <li><a href="/frontend/vistas/cupones/gestionCupones.html">Cupones</a></li>
      </ul>
    </nav>
  </header>

  <section class="dashboard">
    <h2>Métricas Generales</h2>

    <div class="cards">
      <div class="card">
        <i class="fa-solid fa-users"></i>
        <h3>Usuarios Registrados</h3>
        <p id="usuarios" class="metric-number"></p>
      </div>

      <div class="card">
        <i class="fa-solid fa-paw"></i>
        <h3>Solicitudes de Adopción</h3>
       <p id="adopciones" class="metric-number"></p>
      </div>

      <div class="card">
        <i class="fa-solid fa-circle-check"></i>
        <h3>Aprobadas</h3>
       <p id="aprobadas" class="metric-number"></p>
      </div>

      <div class="card">
        <i class="fa-solid fa-circle-xmark"></i>
        <h3>Rechazadas</h3>
       <p id="rechazados" class="metric-number"></p>
      </div>

      
      <div class="card">
        <i class="fa-solid fa-paw"></i>
        <h3>Cantidad de Mascotas</h3>
       <p id="mascotas" class="metric-number"></p>
      </div>
    </div>


  </section>

</body>

<script type="module" src="../../pages/metricas.js"></script>

</html>
