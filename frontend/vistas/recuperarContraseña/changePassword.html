<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="../../styles/changePassword.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../../pages/changePassword.js"></script>
</head>
<body>
    <div class="card">
        <h2>Restablecer contraseña</h2>

        <div class="input-group">
            <label>Nueva contraseña</label>
            <input id="pass1" type="password" placeholder="Ingrese su nueva contraseña">
        </div>

        <div class="input-group">
            <label>Confirmar contraseña</label>
            <input id="pass2" type="password" required placeholder="Confirme su contraseña">
        </div>
        <div class="input-group">
            <label>Ingresar Token</label>
            <input id="token" type="text" required placeholder="Ingrese el token enviado al mail">
        </div>

        <p id="error" class="error"></p>
        <p id="success" class="success"></p>

        <button id="btn">Cambiar contraseña</button>
    </div>
</body>
</html>
